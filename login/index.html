<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Agdangan e-Leave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="/assets/images/agdangan-eleave-logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/login-custom.css">
</head>
<body class="app-shell auth-page">
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/assets/images/agdangan-eleave-logo.png" alt="Agdangan e-Leave official logo" class="brand-logo">
      <div class="brand-copy">
        <span class="eyebrow">Republic of the Philippines</span>
        <h1>Agdangan e-Leave</h1>
        <p>Account access for employees and administrators.</p>
      </div>
    </a>

    <button class="burger" aria-label="Open menu" data-burger><span></span><span></span><span></span></button>
    <nav class="utility-nav" aria-label="Utility navigation">
      <a href="/">Home</a>
      <a href="/#service">Service</a>
    </nav>
  </header>

  <main class="app-layout">
    <!-- Left Decorative Panel (Split layout) -->
    <section class="auth-copy">
      <!-- Decorative layered diagonal shapes -->
      <div class="auth-shapes">
        <div class="auth-shape auth-shape-1"></div>
        <div class="auth-shape auth-shape-2"></div>
        <div class="auth-shape auth-shape-3"></div>
        <div class="auth-shape auth-shape-4"></div>
      </div>

      <!-- Tab Switcher (Matches tab protruding design from the image) -->
      <div class="auth-tabs" aria-label="Select login role">
        <button type="button" class="auth-tab active" data-role-switch="employee">Employee</button>
        <button type="button" class="auth-tab" data-role-switch="admin">Admin</button>
      </div>
    </section>

    <!-- Right Login Card Panel -->
    <section class="auth-card">
      <!-- Municipal Seal Avatar Container -->
      <div class="auth-avatar-wrap" aria-hidden="true">
        <img src="/assets/images/agdangan-seal.webp" alt="Agdangan Municipal Seal">
      </div>

      <form class="auth-form" id="login-form">
        <h3 id="auth-title">Employee Sign In</h3>
        <p class="muted" id="auth-subtitle">Use your employee email and password to open your leave dashboard.</p>

        <div class="field-grid">
          <!-- Email Input -->
          <div class="field field-full">
            <label for="email" class="field-label">Email</label>
            <div class="input-wrapper">
              <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <input id="email" name="email" type="email" placeholder="name@agdangan.gov.ph" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="field field-full">
            <label for="password" class="field-label">Password</label>
            <div class="input-wrapper">
              <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <input id="password" name="password" type="password" placeholder="Enter your password" required>
            </div>
          </div>
        </div>

        <input id="selected-role" name="selectedRole" type="hidden" value="employee">

        <!-- Form Actions (Forgot Password on left, Submit button on right) -->
        <div class="form-actions">
          <a href="#" class="forgot-password-link" onclick="alert('Please contact your HR administrator to reset your password.'); return false;">Forgot Password?</a>
          <button type="submit" class="button button-primary">Login</button>
        </div>
      </form>

      <!-- Social Logins Footer (Representation of the social footer from the design) -->
      <div class="auth-social-footer">
        <span class="auth-social-label">Or Login With</span>
        <div class="auth-social-buttons">
          <button type="button" class="social-btn" onclick="alert('Social login is disabled for municipal employee accounts. Please use official email.');">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.91a8.78 8.78 0 0 0 2.69-6.62z" fill="#4285F4"/>
              <path d="M9 18a8.64 8.64 0 0 0 5.99-2.18l-2.91-2.26A5.47 5.47 0 0 1 9 14.54a5.54 5.54 0 0 1-5.18-3.84H.83v2.33A9 9 0 0 0 9 18z" fill="#34A853"/>
              <path d="M3.82 10.7a5.36 5.36 0 0 1 0-3.4v-2.3H.83a9 9 0 0 0 0 8.03l2.99-2.33z" fill="#FBBC05"/>
              <path d="M9 3.58c1.19 0 2.25.41 3.1 1.21l2.32-2.32A8.99 8.99 0 0 0 9 0 9 9 0 0 0 .83 5.03l2.99 2.3A5.54 5.54 0 0 1 9 3.58z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button type="button" class="social-btn" onclick="alert('Social login is disabled for municipal employee accounts. Please use official email.');">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 9c0-5-4-9-9-9s-9 4-9 9c0 4.5 3.3 8.3 7.6 8.9v-6.3H5.3V9h2.3V7.1C7.6 4.8 9 3.5 11 3.5c1 0 2 .2 2 .2v2.2h-1.1c-1.1 0-1.5.7-1.5 1.4V9h2.5l-.4 2.6h-2.1V18c4.3-.6 7.6-4.4 7.6-8.9z" fill="#1877F2"/>
            </svg>
            Facebook
          </button>
        </div>
      </div>

      <!-- Config warning status banner if Supabase not configured -->
      <div class="status-banner" id="config-status"></div>
    </section>
  </main>

  <script src="/assets/vendor/supabase-js-2.js"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/app.js?v=20260602-head-name"></script>
</body>
</html>
