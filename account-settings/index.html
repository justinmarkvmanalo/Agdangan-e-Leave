<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings | Agdangan e-Leave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css?v=20260603-disapproval-lines">
</head>
<body class="app-shell dashboard-page employee-page account-settings-page">
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/assets/images/agdangan-eleave-logo.png" alt="Agdangan e-Leave official logo" class="brand-logo">
      <div class="brand-copy">
        <span class="eyebrow">Employee Portal</span>
        <h1>Agdangan e-Leave</h1>
        <p>Account security and password management.</p>
      </div>
    </a>

    <button class="burger" aria-label="Open menu" data-burger><span></span><span></span><span></span></button>
    <nav class="utility-nav" aria-label="Account settings navigation">
      <a href="/employee-dashboard">Employee Service</a>
      <a href="/account-settings" class="active">Account Settings</a>
      <button type="button" id="sign-out-button">Sign Out</button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="dashboard-header" id="account-settings">
      <div class="dashboard-title">
        <p class="section-label">Account Settings</p>
        <h2 id="employee-name">Account Settings</h2>
        <p id="employee-meta">Update your employee account password.</p>
      </div>

      <div class="dashboard-meta">
        <strong id="employee-role-badge" class="badge employee-badge">Employee</strong>
      </div>
    </section>

    <section class="dashboard-grid account-settings-grid">
      <article class="dashboard-card dashboard-card-wide">
        <p class="card-label">Security</p>
        <h3>Change Password</h3>
        <form class="auth-form" data-change-password-form>
          <div class="field-grid">
            <div class="field field-full">
              <label for="employee-current-password">Current Password</label>
              <input id="employee-current-password" name="currentPassword" type="password" autocomplete="current-password" required>
            </div>
            <div class="field">
              <label for="employee-new-password">New Password</label>
              <input id="employee-new-password" name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="field">
              <label for="employee-confirm-password">Confirm New Password</label>
              <input id="employee-confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="button button-primary">Update Password</button>
          </div>
        </form>
      </article>
    </section>
  </main>

  <script src="/assets/vendor/supabase-js-2.js"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/app.js?v=20260603-disapproval-lines"></script>
</body>
</html>
